<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F4F2F8" />
    <link rel="icon" href="icon-192.png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Figtree:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Desafio</title>
    <script>
      // aplica o tema escolhido antes de pintar a página (evita piscar)
      try {
        var t = localStorage.getItem('desafio-tema');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        var dark = t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#17111F');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
